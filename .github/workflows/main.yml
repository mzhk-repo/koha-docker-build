name: App Pipeline

on:
  push:
    branches: [ dev, main ]
    paths-ignore:
      - '**/*.md'
      - '.env.example'
      - '.gitignore'
      - 'archive/**'
  pull_request:
    branches: [ dev, main ]
    paths-ignore:
      - '**/*.md'
      - '.env.example'
      - '.gitignore'
      - 'archive/**'
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  deploy-dev:
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    uses: mzhk-repo/shared-workflows/.github/workflows/shared-ci-cd.yml@main
    with:
      environment_name: development
      deploy: false
      use_ansible: false
      build_and_push_docker: true
      push_docker_image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
      docker_image_name: koha-docker-build
      orchestration_script_path: 'scripts/deploy-orchestrator.sh'
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SSH_HOST_KEY_PUB: ${{ secrets.SSH_HOST_KEY_PUB }}
      DEPLOY_PROJECT_DIR: ${{ secrets.DEPLOY_PROJECT_DIR }}
      GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

  deploy-prod:
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: mzhk-repo/shared-workflows/.github/workflows/shared-ci-cd.yml@main
    with:
      environment_name: production
      deploy: false
      use_ansible: false
      build_and_push_docker: true
      push_docker_image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      docker_image_name: koha-docker-build
      orchestration_script_path: 'scripts/deploy-orchestrator.sh'
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SSH_HOST_KEY_PUB: ${{ secrets.SSH_HOST_KEY_PUB }}
      DEPLOY_PROJECT_DIR: ${{ secrets.DEPLOY_PROJECT_DIR }}
      GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

  tag-release:
    name: Tag Release Image
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag latest image for release
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/koha-docker-build
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_prefix=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          short_sha="${COMMIT_SHA:0:7}"

          source_image=""
          if docker buildx imagetools inspect "${image_prefix}:sha-${short_sha}" >/dev/null 2>&1; then
            echo "Found image by commit SHA: ${image_prefix}:sha-${short_sha}"
            source_image="${image_prefix}:sha-${short_sha}"
          elif docker buildx imagetools inspect "${image_prefix}:main" >/dev/null 2>&1; then
            echo "Found image by main branch tag: ${image_prefix}:main"
            source_image="${image_prefix}:main"
          else
            echo "ERROR: Could not find source image (${image_prefix}:sha-${short_sha} or ${image_prefix}:main)" >&2
            exit 1
          fi

          tags_to_apply=(
            --tag "${image_prefix}:${RELEASE_TAG}"
            --tag "${image_prefix}:latest"
          )
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+ ]]; then
            tags_to_apply+=(--tag "${image_prefix}:${RELEASE_TAG#v}")
          fi

          echo "Tagging ${source_image} with: ${tags_to_apply[*]}"
          docker buildx imagetools create "${tags_to_apply[@]}" "${source_image}"

